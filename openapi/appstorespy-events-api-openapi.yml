      - SA
      - ZA
      - AE
      - AU
      - HK
      - ID
      - JP
      - KZ
      - KR
      - MY
      - NZ
      - PK
      - PH
      - SG
      - TW
      - TH
      - VN
      - AR
      - BR
      - MX
      title: AppCountries
      description: An enumeration.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Event:
      properties:
        id:
          type: string
          title: Id
        app:
          type: string
          title: App
        store:
          type: string
          title: Store
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        text:
          type: string
          title: Text
        image:
          type: string
          title: Image
        country:
          type: string
          title: Country
        state:
          type: string
          title: State
        crawled:
          type: string
          format: date-time
          title: Crawled
        date_from:
          type: string
          format: date-time
          title: Date From
        date_to:
          type: string
          format: date-time
          title: Date To
        video:
          type: string
          title: Video
      type: object
      required:
      - id
      - app
      - store
      - type
      - title
      - text
      - image
      - country
      - state
      - crawled
      - date_from
      title: Event
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CacheTime:
      type: string
      enum:
      - 1d
      - 7d
      - 30d
      title: CacheTime
      description: An enumeration.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: API-KEY

          - url_appstorespy
          - name
          - bundle
          - description_full
          - published
          - listing_visible
          - category
          - category_type
          - revenue_month
          - revenue_lifetime
          - downloads_month
          - downloads_lifetime
          - update_date
          - release_date
          - developer_id
          - developer_name
          - description_short
          - whatsnew
          - icon
          - video
          - removal_date
          - version
          - size
          - rating_count
          - rating_value
          - review_count
          - rating_avg

          type: integer
          title: Limit
          description: Count of apps in results
          default: 10
        page:
          type: integer
          title: Page
          description: Offset page
          default: 1
        sort:
          allOf:
          - $ref: '#/components/schemas/IosSortEnum'
          description: Field for sort
        fields:
          items:
            type: string
          type: array
          title: Fields
          description: Fields for select, empty for all
          default:

          default: US
        language:
          allOf:
          - $ref: '#/components/schemas/AppLanguages'
          description: 'Language of meta data. By default: en_US'
        filter:
          $ref: '#/components/schemas/SearchFilterIos'
      type: object
      required:
      - filter
      title: IosAppSearchBody
      example:
        sort: -downloads_month
        fields:
        - id
        - name
        - icon
        - video
        - category_type
        - category
        - url_appstorespy
        language: en_US
        filter:
          name: twitter
          published: true
          category_type: APP
          release_date:
            lte: '2026-08-22'
          update_date:
            lte: '2026-08-22'
          rating_count:
            lte: 1000000
            gte: 0
          active_countries:

  /play/apps/{id}/installs_daily:
    get:
      tags:
      - Google Play
      summary: Get Apps Installs Daily
      description: 'Get Google Play apps daily installs.


        `ipd` is derived from the cumulative install total: each increase is spread evenly across the elapsed days since the total last changed, so collection gaps and lagging reports are amortised rather than reported as a single-day spike. Values are raw and never negative.


        By default these are unsmoothed figures. AppstoreSpy''s Daily Installs chart additionally applies a moving average for readability. Pass `smooth=true` to get that series: a centered, triangular-weighted 9-day moving average of `ipd` (weights 1,2,3,4,5,4,3,2,1; days without data are skipped and the weights renormalised). Neighbouring days outside `start`/`end` are included in the window, so the first and last days are smoothed the same way as the rest.'
      operationId: get_apps_installs_daily_play_apps__id__installs_daily_get
      parameters:
      - description: Apps to return separated by comma(,)
        required: true
        schema:
          type: string
          title: Id
          description: Apps to return separated by comma(,)
        example: com.twitter.android
        name: id
        in: path
      - description: Start date. Format YYYY-MM-DD. Defaults to the 30 days ending at `end`
        required: false
        schema:
          type: string
          format: date
          title: Start
          description: Start date. Format YYYY-MM-DD. Defaults to the 30 days ending at `end`
        name: start
        in: query
      - description: End date. Format YYYY-MM-DD
        required: false
        schema:
          type: string
          format: date
          title: End
          description: End date. Format YYYY-MM-DD
        name: end
        in: query
      - description: Return `ipd` smoothed as on the website chart
        required: false
        schema:
          type: boolean
          title: Smooth
          description: Return `ipd` smoothed as on the website chart
          default: false
        name: smooth
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AppsDailyInstalls'
                type: array
                title: Response Get Apps Installs Daily Play Apps  Id  Installs Daily Get

openapi: 3.2.0
info:
  title: AppstoreSpy Google Play API
  description: '# Authentication


    The Appstorespy API uses API-KEY authentication.


    If you do not have an API Key token, you can get it on your account page https://appstorespy.com/account.


    An API Key is required to be sent as part of every request in request header.


    ```


    -H ''accept: application/json''


    -H ''API-KEY: ''


    ```


    # Agents and MCP


    AI agents can call the same endpoints as MCP tools at https://api.appstorespy.com/mcp, with the same API-KEY header and the same credits per call.


    https://api.appstorespy.com/agentic-access lists what each operation costs and whether it reads, queues or writes; https://api.appstorespy.com/skills/ holds one agent skill per capability; https://api.appstorespy.com/llms.txt links every agent document.


    # Fields


    Use the fields parameter to specify which fields should be returned.


    Example:


    ```


    Request: fields=name,developer_name,ipd,downloads,...


    Response: {name: ..., developer_name: ..., ipd: ..., downloads: ..., ...}


    ```


    Don`t use fields parameter if you need to get all fields.


    # Sort


    When you use search, you can add a sort parameter.


    ```


    Request: sort=ratingCount


    Response: [{name: app1, ratingCount: 4.2}, {name: app2, ratingCount: 4.4}, ...]


    ```


    If you need DESC sorting add "-" before sort parametr.


    ```


    Request: sort=-ratingCount


    Response: [{name: app2, ratingCount: 4.4}, {name: app1, ratingCount: 4.2}, ...]


    ```


    # County & Language params


    ...


    # Status codes / Error codes


    * 200 OK.


    * 202 Accepted - The app was not present in our databases and has been submitted for crawling. If the app is available anywhere, it will be available soon.


    * 204 No Content - No data for requested country.


    * 403 Forbidden - Your access token is not valid.


    * 429 Too Many Requests - Your request rate is over the limit.'
  termsOfService: https://appstorespy.com/agreement
  contact:
    name: AppstoreSpy Support
    url: https://appstorespy.com/support
    email: support@appstorespy.com
  license:
    name: Proprietary
    url: https://appstorespy.com/agreement
  version: 1.1.1
tags:
- name: Google Play
  description: 'Google Play apps and developers: lookup, search, reviews, rankings, similar apps, daily installs, download and revenue estimates, live store listings and reference data.'
  externalDocs:
    description: Fields, daily installs and live listings
    url: https://github.com/romamo/appstorespy-api-docs
paths:
  /play/apps:
    get:
      tags:
      - Google Play
      summary: Search Google Play apps by query
      description: Free-text search across Google Play listings, returning a ranked list of matching apps. To filter on structured criteria such as revenue, installs or category, use `POST /play/apps/query`.
      operationId: get_app_search_play_apps_get
      parameters:
      - description: Word or phrase for search.
        required: false
        schema:
          type: string
          title: Q
          description: Word or phrase for search.
        example: X
        name: q
        in: query
      - description: Empty for all.
        required: false
        schema:
          type: boolean
          title: Published
          description: Empty for all.
        name: published
        in: query
      - description: Country for specific country fields. Default - US.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppCountries'
          description: Country for specific country fields. Default - US.
        name: country
        in: query
      - description: 'Language of meta data. By default: store default language.'
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppLanguages'
          description: 'Language of meta data. By default: store default language.'
        name: language
        in: query
      - description: Fields to return separated by comma(,)
        required: false
        schema:
          type: string
          title: Fields
          description: Fields to return separated by comma(,)
        name: fields
        in: query
      - description: Sort params separated by comma(,)
        required: false
        schema:
          type: string
          title: Sort
          description: Sort params separated by comma(,)
        example: -installs_exact,-revenue
        name: sort
        in: query
      - description: Count per page
        required: false
        schema:
          type: integer
          maximum: 1000.0
          title: Limit
          description: Count per page
          default: 10
        name: limit
        in: query
      - description: Page
        required: false
        schema:
          type: integer
          title: Page
          description: Page
          default: 1
        name: page
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlayApp'
                type: array
                title: Response Get App Search Play Apps Get
              example:
              - id: com.spotify.music
                name: 'Spotify: Music and Podcasts'
                developer_id: '6523013212965523194'
                developer_name: Spotify AB
                category: MUSIC_AND_AUDIO
                published: true
                rating_count: 36433795
                rating_value: 4.2
                revenue: 39000000
                downloads: 24000000
                url_appstorespy: https://appstorespy.com/android-google-play/com.spotify.music-trends-revenue-statistics-downloads-ratings
              - id: dev.netlob.spotistats
                name: stats.fm for Spotify
                developer_id: '7791363214102462004'
                developer_name: StatsFM B.V.
                category: MUSIC_AND_AUDIO
                published: true
                rating_count: 113181
                rating_value: 4.2
                revenue: 60000
                downloads: 100000
                url_appstorespy: https://appstorespy.com/android-google-play/dev.netlob.spotistats-trends-revenue-statistics-downloads-ratings
            text/csv: {}
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '401':
          description: The `API-KEY` header is missing or holds an unknown key
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: integer
                required:
                - message
                - code
              example:
                message: Wrong key
                code: 401
        '402':
          description: The credit balance does not cover this call's price; nothing was charged
          content:
            application/json:
              schema:
                type: string
              example: Insufficient credits in your balance
          headers:
            X-Cost:
              description: Price of the call that did not fit; nothing was charged
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits on the account when the call was refused
              schema:
                type: integer
      security:
      - APIKeyHeader: []
      x-cost-credits: 1

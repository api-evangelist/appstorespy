  /play/apps/{id}/listing:
    get:
      tags:
      - Google Play
      summary: Get the Google Play listing of an app in any language
      description: 'Returns the store listing of one app for a country and language exactly as Google Play serves it: title, short and full description, what''s new, icon, feature graphic, trailer and screenshots. Any language Google Play Console accepts can be requested. The listing is crawled on demand and kept; `freshness` sets how old a kept listing may be before it is crawled again. A call waits for a running crawl for up to about 30 seconds and answers 202 with the crawl state if it is still running; repeat the same request to get the listing. Pass `wait=false` to get the 202 immediately. Repeated requests for the same listing share one crawl. `translated` tells whether Google Play machine-translated the texts instead of showing a translation the developer supplied. The call that queues a crawl costs the crawl price, even when it answers 202; a call served from a kept listing, including a kept not-found, costs the read price; a 202 to a call that found the crawl already running costs nothing, and so do a 422, a 429 and any 5xx, a failed crawl (502) included.'
      operationId: get_listing_play_apps__id__listing_get
      parameters:
      - description: App ID(bundle)
        required: true
        schema:
          type: string
          title: Id
          description: App ID(bundle)
        example: com.twitter.android
        name: id
        in: path
      - description: 'Country of the listing (Google Play `gl`). By default: US.'
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppCountries'
          description: 'Country of the listing (Google Play `gl`). By default: US.'
          default: US
        name: country
        in: query
      - description: 'Language of the listing (Google Play `hl`), any Google Play Console locale. By default: en_US.'
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/PlayListingLanguages'
          description: 'Language of the listing (Google Play `hl`), any Google Play Console locale. By default: en_US.'
          default: en_US
        name: language
        in: query
      - description: How old a kept listing may be before it is crawled again.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/CacheTime'
          description: How old a kept listing may be before it is crawled again.
          default: 1d
        name: freshness
        in: query
      - description: Wait for a running crawl, or answer 202 right away.
        required: false
        schema:
          type: boolean
          title: Wait
          description: Wait for a running crawl, or answer 202 right away.
          default: true
        name: wait
        in: query
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayListing'
                anyOf:
                - $ref: '#/components/schemas/PlayListing'
                - $ref: '#/components/schemas/PlayListingPending'
                title: Response Get Listing Play Apps  Id  Listing Get
              example:
                id: com.whatsapp
                country: US
                language: en_US
                crawled: '2026-10-02T08:52:53+00:00'
                url: https://play.google.com/store/apps/details?id=com.whatsapp&hl=en_US&gl=US
                name: WhatsApp Messenger
                short: Simple. Reliable. Private.
                description: WhatsApp from Meta is a FREE messaging and video calling app.
                whatsnew: You can now choose to share recent group history with new members when you add them to a group
                icon: https://lh3.googleusercontent.com/Gqxk4T0uZsDwFp07DE-508hkyvcNmgFuRwPiwTEfF7D7OzGv1FdHDzEyMxNsSBZLOJlGpe3ULvVM2RgrRAlBqA
                feature: https://lh3.googleusercontent.com/eLX_xvno2Kq_zvpkkP8yPBRfo2TEQSrv7m7WrQ6xloPsDRJ85XQ28kGYuoR-_EBWh2Uoq2GMlDvlBEIxHRyhuSg
                screenshots:
                - https://lh3.googleusercontent.com/GQF4h3VL-kklOrVS_f1QRAJJZa2zQyVNcFbKdOIkvI_Pcu1op0Sy3uiryiTxpdcCDs7vEDA9eq0eWbxo0fx_wc8
                - https://lh3.googleusercontent.com/Q042rTbs53V_jW_c5fMqnNLCf-FBKiO2KiFKJJACa65oMCkaxqDSFKPQ7TH8nYetS-js-fMV7ptXSsF-aCkvcw
                translated: false
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this API key (30/minute)
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets
              schema:
                type: integer
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '202':
          description: The crawl is queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayListingPending'
              example:
                id: com.whatsapp
                country: US
                language: en_US
                status: pending
                requested: '2026-10-02T08:52:41+00:00'
                message: The crawl is in progress. Repeat the same request to get the listing once it is done.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this API key (30/minute)
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets
              schema:
                type: integer
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '404':
          description: The app is not on Google Play for this country
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '502':
          description: Google Play could not be crawled; the credit was refunded
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '401':
          description: The `API-KEY` header is missing or holds an unknown key
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: integer
                required:
                - message
                - code
              example:
                message: Wrong key
                code: 401
        '429':
          description: The per-key rate limit of this operation is exhausted; retry after `Retry-After` seconds. It costs no credits, except on job endpoints (https://github.com/romamo/as-rest/issues/99)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: 'Rate limit exceeded: 30 per 1 minute'
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this API key (30/minute)
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets
              schema:
                type: integer
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '402':
          description: The credit balance does not cover this call's price; nothing was charged
          content:
            application/json:
              schema:
                type: string
              example: Insufficient credits in your balance
          headers:
            X-Cost:
              description: Price of the call that did not fit; nothing was charged
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits on the account when the call was refused
              schema:
                type: integer
      security:
      - APIKeyHeader: []
      x-cost-credits: 3
  /play/apps/query:
    post:
      tags:
      - Google Play
      summary: Get Filter Search
      description: '|**Fields**||||

        |---|---|---|---|

        |**Name** |**Type** |**Sort**|**Description**|

        |name |string |- |Name|

        |bundle |string |- |Bundle|

        |description_full |string |- |Description|

        |published |boolean |- |Published|

        |listing_visible |boolean |- |Published in request country|

        |category |string |- |Category|

        |category_type |string |- |Type|

        |revenue_month |integer |+ |Monthly Revenue|

        |revenue_lifetime |integer |- |Lifetime Revenue|

        |downloads_month |integer |+ |Monthly Downloads|

        |downloads_lifetime|integer |- |Lifetime Downloads|

        |update_date |date ISO8601|+ |Last Updated|

        |release_date |date ISO8601|+ |Release date|

        |developer_name |string |- |Developer name|

        |description_short|string |- |Short description|

        |whatsnew |string |- |Whatsnew|

        |icon |string |- |Image|

        |video |string |- |Trailer|

        |screenshots |[]string |- |Screenshots|


openapi: 3.2.0
info:
  title: AppstoreSpy App Store API
  description: '# Authentication


    The Appstorespy API uses API-KEY authentication.


    If you do not have an API Key token, you can get it on your account page https://appstorespy.com/account.


    An API Key is required to be sent as part of every request in request header.


    ```


    -H ''accept: application/json''


    -H ''API-KEY: ''


    ```


    # Agents and MCP


    AI agents can call the same endpoints as MCP tools at https://api.appstorespy.com/mcp, with the same API-KEY header and the same credits per call.


    https://api.appstorespy.com/agentic-access lists what each operation costs and whether it reads, queues or writes; https://api.appstorespy.com/skills/ holds one agent skill per capability; https://api.appstorespy.com/llms.txt links every agent document.


    # Fields


    Use the fields parameter to specify which fields should be returned.


    Example:


    ```


    Request: fields=name,developer_name,ipd,downloads,...


    Response: {name: ..., developer_name: ..., ipd: ..., downloads: ..., ...}


    ```


    Don`t use fields parameter if you need to get all fields.


    # Sort


    When you use search, you can add a sort parameter.


    ```


    Request: sort=ratingCount


    Response: [{name: app1, ratingCount: 4.2}, {name: app2, ratingCount: 4.4}, ...]


    ```


    If you need DESC sorting add "-" before sort parametr.


    ```


    Request: sort=-ratingCount


    Response: [{name: app2, ratingCount: 4.4}, {name: app1, ratingCount: 4.2}, ...]


    ```


    # County & Language params


    ...


    # Status codes / Error codes


    * 200 OK.


    * 202 Accepted - The app was not present in our databases and has been submitted for crawling. If the app is available anywhere, it will be available soon.


    * 204 No Content - No data for requested country.


    * 403 Forbidden - Your access token is not valid.


    * 429 Too Many Requests - Your request rate is over the limit.'
  termsOfService: https://appstorespy.com/agreement
  contact:
    name: AppstoreSpy Support
    url: https://appstorespy.com/support
    email: support@appstorespy.com
  license:
    name: Proprietary
    url: https://appstorespy.com/agreement
  version: 1.1.1
tags:
- name: App Store
  description: 'App Store apps and developers: lookup, search, reviews, rankings, similar apps, download and revenue estimates and reference data.'
  externalDocs:
    description: Fields, sorting and paging
    url: https://github.com/romamo/appstorespy-api-docs
paths:
  /ios/apps/{id}:
    get:
      tags:
      - App Store
      summary: Get App Store app by ID
      description: Returns the full App Store listing for a single app, looked up by its numeric App Store id. Use `country` to select the storefront and `language` for the metadata language; `fields` limits the response to the columns you need.
      operationId: get_app_details_ios_apps__id__get
      parameters:
      - description: App ID
        required: true
        schema:
          type: string
          title: Id
          description: App ID
        example: '333903271'
        name: id
        in: path
      - description: Fields to return separated by comma(,)
        required: false
        schema:
          type: string
          title: Fields
          description: Fields to return separated by comma(,)
        name: fields
        in: query
      - description: 'Country for which return data. By default: US.'
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppCountries'
          description: 'Country for which return data. By default: US.'
        name: country
        in: query
      - description: 'Language of meta data. By default: store default language.'
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppLanguages'
          description: 'Language of meta data. By default: store default language.'
        name: language
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IosApp'
              example:
                id: '310633997'
                bundle: net.whatsapp.WhatsApp
                country: US
                lang: en_US
                published: true
                category:
                - SOCIAL_NETWORKING
                type: APP
                name: WhatsApp Messenger
                short: Simple. Reliable. Private.
                description: WhatsApp from Meta is a free messaging and calling app used by over 2 billion people across 180+ countries.
                icon: https://is2-ssl.mzstatic.com/image/thumb/Purple211/v4/24/b5/a4/24b5a4ad-175f-1939-210b-7e14f9f34452/AppIcon-0-0-1x_U007epad-0-0-0-1-0-0-sRGB-0-85-220.png/300x300bb.jpg
                developer_id: '310634000'
                developer_name: WhatsApp Inc.
                seller: WhatsApp Inc.
                website: http://www.whatsapp.com/
                url: https://apps.apple.com/us/app/id310633997
                iap: true
                rating_count: 18718834
                rating_value: 4.7
                revenue: 1000000
                downloads: 6000000
                devices:
                - mac
                - watch
                - iphone
                - ipad
                - ipod
                version: 26.39.73
                size: 352321536
                released: '2009-05-04'
                updated: '2026-10-05'
                crawled: '2026-10-05T19:34:19.455719+00:00'
                top_countries_revenue:
                - US
                - BR
                - MX
                - ID
                - UK
                top_countries_downloads:
                - IN
                - PK
                - ID
                - NG
                - MX
                url_appstorespy: https://appstorespy.com/ios-apple-store/310633997-trends-revenue-statistics-downloads-ratings
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '206':
          description: Partial Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IosApp'
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits left on the account after this call
              schema:
                type: integer
            X-Receipt:
              description: Id of this call's billing receipt
              schema:
                type: string
        '401':
          description: The `API-KEY` header is missing or holds an unknown key
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: integer
                required:
                - message
                - code
              example:
                message: Wrong key
                code: 401
        '402':
          description: The credit balance does not cover this call's price; nothing was charged
          content:
            application/json:
              schema:
                type: string
              example: Insufficient credits in your balance
          headers:
            X-Cost:
              description: Price of the call that did not fit; nothing was charged
              schema:
                type: integer
            X-Remaining-Credits:
              description: Credits on the account when the call was refused
              schema:
                type: integer
      security:
      - APIKeyHeader: []
      x-cost-credits: 1
  /ios/apps:
    get:
      tags:
      - App Store
      summary: Search App Store apps by query
      description: Free-text search across App Store listings, returning a ranked list of matching apps. To filter on structured criteria such as revenue, downloads or category, use `POST /ios/apps/query`.
      operationId: get_app_search_ios_apps_get
      parameters:
      - description: Word or phrase for search.
        required: false
        schema:
          type: string
          title: Q
          description: Word or phrase for search.
        example: Twitter
        name: q
        in: query
      - description: Country for specific country fields. Default - US.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppCountries'
          description: Country for specific country fields. Default - US.
        name: country
        in: query
      - description: Fields to return separated by comma(,)
        required: false
        schema:
          type: string
          title: Fields
          description: Fields to return separated by comma(,)
        name: fields
        in: query
      - description: Sort params separated by comma(,)
        required: false
        schema:
          type: string
          title: Sort
          description: Sort params separated by comma(,)
        example: -revenue
        name: sort
        in: query
      - description: Count per page
        required: false
        schema:
          type: integer
          maximum: 1000.0
          title: Limit
          description: Count per page
          default: 10
        name: limit
        in: query
      - description: Page
        required: false
        schema:
          type: integer
          title: Page
          description: Page
          default: 1
        name: page
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:

  /ios/apps/{id}/reviews:
    get:
      tags:
      - App Store
      summary: Get App Store app reviews by app ID
      description: Returns user reviews for a single App Store app. Reviews are storefront-specific, so `country` changes which set is returned.
      operationId: get_reviews_ios_apps__id__reviews_get
      parameters:
      - description: App ID
        required: true
        schema:
          type: string
          title: Id
          description: App ID
        example: '333903271'
        name: id
        in: path
      - description: App storefront
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AppCountries'
          description: App storefront
        name: country
        in: query
      - description: Fields to return separated by comma(,)
        required: false
        schema:
          type: string
          title: Fields
          description: Fields to return separated by comma(,)
        name: fields
        in: query
      - description: Count of reviews per page
        required: false
        schema:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          description: Count of reviews per page
          default: 10
        name: limit
        in: query
      - description: Sort params separated by comma(,)
        required: false
        schema:
          type: string
          title: Sort
          description: Sort params separated by comma(,)
        example: rating,-date
        name: sort
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IosReview'
                type: array
                title: Response Get Reviews Ios Apps  Id  Reviews Get

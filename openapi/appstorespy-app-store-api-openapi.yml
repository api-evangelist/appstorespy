  /ios/apps/similar:
    post:
      tags:
      - App Store
      summary: Get similar App Store apps
      description: Returns the apps App Store lists as similar to the given app. Set `link` to the reverse direction to get the apps that list the given app as similar to them instead.
      operationId: get_similar_ios_apps_similar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IosSimilarSearchBody'
            example:
              id: '310633997'
              link: to
              limit: 2
              sort: -downloads_month
              fields:
              - id
              - name
              - developer_name
              - category
              - downloads_month
              - rating_value
              filter:
                published: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IosAppListResponse'
              example:
                data:
                - id: '686449807'
                  name: Telegram Messenger
                  category: SOCIAL_NETWORKING
                  downloads_month: 6000000
                  developer_name: Telegram FZ-LLC
                  rating_value: 4.0
                - id: '284882215'
                  name: Facebook
                  category: SOCIAL_NETWORKING
                  downloads_month: 6000000
                  developer_name: Meta Platforms, Inc.
                  rating_value: 4.5
          headers:
            X-Cost:
              description: 'Credits this call cost, after any refund: 0 for a 422, a 429 or a 5xx response, except on job endpoints (the recrawl, liveops and suggestions operations), which are still billed; see https://github.com/romamo/as-rest/issues/99'

    update:
      - name: Jobs
        description: Asynchronous store-search crawl jobs (POST to create, GET to retrieve by search_id).
      - name: Suggestions
        description: Google Play keyword suggestion crawls; returns 202 while a term is being crawled.
      - name: Events
        description: Google Play LiveOps events for an app; returns 202 while an app is being crawled.
      - name: Search Filter v.2
        description: Multi-parameter filter search over the app database.

billing: A tool call is dispatched through the same middleware as the REST endpoint it wraps and costs
  the caller the same credits. Tool results carry the upstream total-count where the endpoint returns
  one.
tools:
- name: search_apps
  title: Search apps
  description: Free-text search over app listings on one store, returning a ranked list. Use this when
    you have a name or a phrase. To select apps by revenue, downloads, category or rating instead, use
    filter_apps, which is far more precise.
  required:
  - store
  read_only: true
- name: get_app
  title: Get app
  description: Full listing for one app. The id is the bundle id on Google Play (com.twitter.android)
    and the numeric App Store id on iOS (333903271).
  required:
  - store
  - id
  read_only: true
- name: filter_apps
  title: Filter apps
  description: 'Search apps by structured criteria: revenue, downloads, rating, category, developer, release
    and update dates, countries of availability. This is the main market-research tool and the one to
    reach for over search_apps whenever the question is about a segment rather than a name.'
  required:
  - store
  - filter
  read_only: true
- name: summarize_apps
  title: Summarise apps
  description: 'Aggregate totals for every app matching a filter, without returning the apps. Use this
    first to size a segment: it answers ''how many apps and how much revenue'' in one call, where paging
    through filter_apps would cost many.'
  required:
  - store
  - filter
  read_only: true
- name: get_similar_apps
  title: Get similar apps
  description: Apps the store lists as similar to a given app. `link` set to `to` returns what the store
    shows on this app's page; `from` reverses the question and returns the apps that list this one as
    similar to them, which is how you find who is competing for its audience.
  required:
  - store
  - id
  - link
  read_only: true
- name: get_app_reviews
  title: Get app reviews
  description: User reviews for one app. Reviews are storefront- and language-specific, so country and
    language change which set comes back rather than just how it is rendered.
  required:
  - store
  - id
  - language
  read_only: true
- name: get_rankings
  title: Get chart rankings
  description: Chart positions over a date range, one row per app per chart per day. A chart is the triple
    (country, category, collection), plus platform on the App Store.
  required:
  - store
  read_only: true
- name: search_developers
  title: Search developers
  description: Free-text search over developers. The query also accepts `field:value` terms, for example
    `hq_country:US`.
  required:
  - store
  read_only: true
- name: get_developer
  title: Get developer
  description: One developer record, including publisher identifiers and headquarters country.
  required:
  - store
  - id
  read_only: true
- name: filter_developers
  title: Filter developers
  description: Search developers by structured criteria, with paging and sorting.
  required:
  - store
  - filter
  read_only: true
- name: get_app_estimates
  title: Get download and revenue estimates
  description: Download and revenue estimates for one or more apps over a date range.
  required:
  - store
  - id
  read_only: true
- name: get_keyword_suggestions
  title: Get keyword suggestions
  description: Google Play search autocomplete for a term. Answers 202 with a partial result while a fresh
    crawl runs, so call again shortly for the complete set.
  required:
  - q
  read_only: true
- name: get_liveops_events
  title: Get LiveOps events
  description: 'LiveOps events Google Play shows on an app listing: sales, tournaments, updates and new
    content. Answers 202 while a fresh crawl runs.'
  required:
  - app
  read_only: true

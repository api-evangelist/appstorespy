tools_count: 14
tools:
- name: search_apps
  description: Free-text search over app listings on one store, returning a ranked list. Use this when you have
    a name or a phrase. To select apps by revenue, downloads, category or rating instead, use filter_apps, which
    is far more precise.
- name: get_app
  description: Full listing for one app. The id is the bundle id on Google Play (com.twitter.android) and the numeric
    App Store id on iOS (333903271).
- name: filter_apps
  description: 'Search apps by structured criteria: revenue, downloads, rating, category, developer, release and
    update dates, countries of availability. This is the main market-research tool and the one to reach for over
    search_apps whenever the question is about a segment rather than a name.'
- name: summarize_apps
  description: 'Aggregate totals for every app matching a filter, without returning the apps. Use this first to
    size a segment: it answers ''how many apps and how much revenue'' in one call, where paging through filter_apps
    would cost many.'
- name: get_similar_apps
  description: Apps the store lists as similar to a given app. `link` set to `to` returns what the store shows on
    this app's page; `from` reverses the question and returns the apps that list this one as similar to them, which
    is how you find who is competing for its audience.
- name: get_app_reviews
  description: User reviews for one app. Reviews are storefront- and language-specific, so country and language
    change which set comes back rather than just how it is rendered.
- name: get_rankings
  description: Chart positions over a date range, one row per app per chart per day. A chart is the triple (country,
    category, collection), plus platform on the App Store.
- name: search_developers
  description: Free-text search over developers. The query also accepts `field:value` terms, for example `hq_country:US`.
- name: get_developer
  description: One developer record, including publisher identifiers and headquarters country.
- name: filter_developers
  description: Search developers by structured criteria, with paging and sorting.
- name: get_app_estimates
  description: Download and revenue estimates for one or more apps over a date range.
- name: get_keyword_suggestions
  description: Google Play search autocomplete for a term. Answers 202 with a partial result while a fresh crawl
    runs, so call again shortly for the complete set.
- name: get_liveops_events
  description: 'LiveOps events Google Play shows on an app listing: sales, tournaments, updates and new content.
    Answers 202 while a fresh crawl runs.'
- name: get_app_listing
  description: 'The Google Play store listing of one app for a country and language exactly as Google Play serves
    it: title, short and full description, what''s new, icon, feature graphic, trailer and screenshots. Accepts
    any Google Play Console locale, not only the languages get_app stores, so use it for localized metadata such
    as Indonesian, Thai or Portuguese (Portugal). The listing is crawled on demand and kept; answers 202 while the
    crawl runs, so call again shortly. `translated` is true when Google Play shows a machine translation because
    the developer has not supplied that language.'
tools_source: live tools/list via initialize handshake, 2026-10-03

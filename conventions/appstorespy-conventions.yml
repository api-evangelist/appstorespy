idempotency:
  supported: false
  state: na
  header: null
  note: >-
    No Idempotency-Key header or equivalent exists in the contract or the docs.
    Exposure is low rather than absent: the six POST/trigger operations
    (filter-search, similar, summary, recrawl, jobs/search) either compute a
    query or enqueue a crawl - none creates a billable or externally visible
    resource - but each call consumes API credits, so a retried request costs
    credits twice with no dedupe key to prevent it. No Idempotency pointer is
    wired into apis.yml.
dry_run_mode:
  supported: false
  state: na
  note: The API is a read/query surface; there is no state-changing action to rehearse.
reversibility:
  state: na
  grade: none
  write_surfaces:
    - operation: create_search_jobs_search_post
      path: POST /jobs/search
      effect: Enqueues an asynchronous store-search crawl job and consumes API credits.
      reversal_operation: null
      window: null
      evidence: >-
        Neither the OpenAPI nor https://api.appstorespy.com/docs documents a
        cancel, delete or abort operation for a search job - the only other jobs
        operation is GET /jobs/search, which reads a result by search_id.
    - operation: get_recrawl_ios_apps__id__recrawl_get
      path: GET /ios/apps/{id}/recrawl
      effect: Requests a fresh crawl of an App Store app; consumes API credits.
      reversal_operation: null
      window: null
    - operation: get_recrawl_play_apps__id__recrawl_get
      path: GET /play/apps/{id}/recrawl
      effect: Requests a fresh crawl of a Google Play app; consumes API credits.
      reversal_operation: null
      window: null
  note: >-
    AppstoreSpy is a read-mostly market-intelligence API: 33 operations, none of
    which create, update or delete a customer-owned resource. The only writes are
    crawl/job triggers against AppstoreSpy's own pipeline. Nothing an agent can
    do here needs undoing in the customer's account, so reversibility is `na`
    rather than a zero - but note the one irreversible cost is CREDIT SPEND: a
    trigger or job cannot be cancelled and the credits are consumed. No refund or
    credit-reversal window is published anywhere on the pricing page or in the
    Agreement, and none is asserted here.

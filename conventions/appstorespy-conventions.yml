async_semantics:
  pattern: 202-then-retry
  operations:
    - get_suggests_play_suggestions_get
    - get_events_play_liveops_get
    - get_recrawl_ios_apps__id__recrawl_get
    - get_recrawl_play_apps__id__recrawl_get
    - create_search_jobs_search_post
    - get_search_jobs_search_get
  detail: >-
    202 Accepted means the app/term was absent from the database and has been
    queued for crawling; the caller retries the same request later. /jobs/search
    is the explicit job form - POST creates a crawl job, GET retrieves it by
    search_id. No callback, webhook or polling interval is documented.

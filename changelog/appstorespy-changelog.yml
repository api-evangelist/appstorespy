- breaking: false
  highlights:
  - Fixed POST /{store}/apps/query filters that were accepted but never applied. rating_avg, iap, editorial, with_ads, advertised and removal_date
    returned HTTP 200 and had no effect on the result set. They now filter. A caller who was sending any of them will see fewer results than before,
    which is the point, but it is a change in what comes back for an unchanged request.
  - 'ValueRange no longer truncates float bounds: rating_avg gte 4.9 was being read as gte 4.'
  date: '2026-07-06'
